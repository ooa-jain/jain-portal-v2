# nginx site for the Jain OOA Portal (Next.js app on 127.0.0.1:8091).
# Install:  cp web/deploy/nginx-jain-ooa-portal.conf /etc/nginx/sites-available/jain-ooa-portal
# Main address: https://jain-ooa-portal.juooa.cloud
# jain-sarathi.juooa.cloud and ooa-portal.juooa.cloud redirect to it, keeping the path.

server {
    listen 443 ssl;
    server_name jain-ooa-portal.juooa.cloud;
    ssl_certificate /etc/letsencrypt/live/jain-ooa-portal.juooa.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jain-ooa-portal.juooa.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document Library uploads can be up to 20 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name jain-sarathi.juooa.cloud;
    ssl_certificate /etc/letsencrypt/live/jain-sarathi.juooa.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jain-sarathi.juooa.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://jain-ooa-portal.juooa.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name ooa-portal.juooa.cloud;
    ssl_certificate /etc/letsencrypt/live/ooa-portal.juooa.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ooa-portal.juooa.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://jain-ooa-portal.juooa.cloud$request_uri;
}

server {
    listen 80;
    server_name jain-ooa-portal.juooa.cloud jain-sarathi.juooa.cloud ooa-portal.juooa.cloud;
    return 301 https://jain-ooa-portal.juooa.cloud$request_uri;
}
